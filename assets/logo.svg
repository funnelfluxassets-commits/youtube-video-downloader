<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- YouTube Red to Crimson Gradient -->
    <linearGradient id="ytGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ff0000" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#dc2626" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Square with YouTube Gradient Glow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#ytGradient)" filter="url(#glow)" />
  
  <!-- Inner Obsidian Dark Container -->
  <rect x="52" y="52" width="408" height="408" rx="94" fill="url(#darkBg)" />

  <!-- YouTube Play Screen Screen Icon -->
  <rect x="116" y="146" width="280" height="220" rx="48" fill="#ff0000" />

  <!-- Crisp White Play Triangle in Center -->
  <polygon points="230,206 230,306 312,256" fill="#ffffff" />
</svg>
